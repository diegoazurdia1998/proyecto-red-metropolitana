name: 'dbt_red_metropolitana'
version: '1.0.0'
config-version: 2

profile: 'dbt_red_metropolitana'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_red_metropolitana:
    staging:
      +schema: staging
      +materialized: view      # Staging es liviano y efímero
    silver:
      +schema: silver
      +materialized: table     # Silver almacena datos limpios e integrados
    gold:
      +schema: gold
      +materialized: table     # gold almacena dimensiones y tablas de hechos

seeds:
  dbt_red_metropolitana:
    +schema: staging